name: RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:

      # ================================
      # CONFIGURE WINDOWS RDP
      # ================================
      - name: Configure Core RDP Settings
        shell: powershell
        run: |
          Write-Host "Configuring Remote Desktop..."

          # Enable Remote Desktop
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name "fDenyTSConnections" `
            -Value 0 `
            -Force

          # Disable NLA
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "UserAuthentication" `
            -Value 0 `
            -Force

          # Set RDP security layer
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "SecurityLayer" `
            -Value 0 `
            -Force

          # Remove existing firewall rule if present
          netsh advfirewall firewall delete rule name="RDP-Tailscale"

          # Allow RDP port 3389
          netsh advfirewall firewall add rule `
            name="RDP-Tailscale" `
            dir=in `
            action=allow `
            protocol=TCP `
            localport=3389

          # Restart Remote Desktop service
          Restart-Service -Name TermService -Force

          Write-Host "RDP configuration complete."


      # ================================
      # CREATE RDP USER
      # SAME PASSWORD EVERY TIME
      # ================================
      - name: Create RDP User
        shell: powershell
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          Write-Host "Creating RDP user..."

          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
              Write-Error "RDP_PASSWORD GitHub secret is missing."
              exit 1
          }

          $securePass = ConvertTo-SecureString `
            $env:RDP_PASSWORD `
            -AsPlainText `
            -Force

          # Check if RDP user already exists
          $existingUser = Get-LocalUser `
            -Name "RDP" `
            -ErrorAction SilentlyContinue

          if ($existingUser) {

              Write-Host "RDP user already exists. Updating password..."

              Set-LocalUser `
                -Name "RDP" `
                -Password $securePass

          }
          else {

              Write-Host "Creating new RDP user..."

              New-LocalUser `
                -Name "RDP" `
                -Password $securePass `
                -AccountNeverExpires `
                -PasswordNeverExpires
          }

          # Add to Administrators
          $adminMember = Get-LocalGroupMember `
            -Group "Administrators" `
            -Member "RDP" `
            -ErrorAction SilentlyContinue

          if (-not $adminMember) {
              Add-LocalGroupMember `
                -Group "Administrators" `
                -Member "RDP"
          }

          # Add to Remote Desktop Users
          $rdpMember = Get-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member "RDP" `
            -ErrorAction SilentlyContinue

          if (-not $rdpMember) {
              Add-LocalGroupMember `
                -Group "Remote Desktop Users" `
                -Member "RDP"
          }

          # Verify account
          $user = Get-LocalUser `
            -Name "RDP" `
            -ErrorAction SilentlyContinue

          if (-not $user) {
              Write-Error "RDP user creation failed."
              exit 1
          }

          Write-Host "RDP user created successfully."
          Write-Host "Username: RDP"


      # ================================
      # INSTALL TAILSCALE
      # ================================
      - name: Install Tailscale
        shell: powershell
        run: |
          Write-Host "Installing Tailscale..."

          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"

          $installerPath = "$env:TEMP\tailscale.msi"

          Invoke-WebRequest `
            -Uri $tsUrl `
            -OutFile $installerPath

          Start-Process `
            msiexec.exe `
            -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" `
            -Wait

          Remove-Item `
            $installerPath `
            -Force

          Write-Host "Tailscale installed."


      # ================================
      # CONNECT TO TAILSCALE
      # ================================
      - name: Establish Tailscale Connection
        shell: powershell
        run: |
          Write-Host "Connecting to Tailscale..."

          & "$env:ProgramFiles\Tailscale\tailscale.exe" up `
            --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} `
            --hostname=gh-runner-$env:GITHUB_RUN_ID

          $tsIP = $null
          $retries = 0

          while (-not $tsIP -and $retries -lt 10) {

              $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4

              if (-not $tsIP) {
                  Write-Host "Waiting for Tailscale IP..."
                  Start-Sleep -Seconds 5
              }

              $retries++
          }

          if (-not $tsIP) {

              Write-Error "Tailscale IP not assigned."

              exit 1
          }

          "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

          Write-Host "Tailscale connected."
          Write-Host "Tailscale IP: $tsIP"


      # ================================
      # TEST RDP
      # ================================
      - name: Verify RDP Accessibility
        shell: powershell
        run: |
          Write-Host "Testing RDP..."

          Write-Host "Tailscale IP: $env:TAILSCALE_IP"

          $testResult = Test-NetConnection `
            -ComputerName $env:TAILSCALE_IP `
            -Port 3389

          if (-not $testResult.TcpTestSucceeded) {

              Write-Error "RDP connection test failed."

              exit 1
          }

          Write-Host "RDP connectivity successful!"


      # ================================
      # KEEP RDP RUNNING
      # ================================
      - name: Maintain Connection
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "========================================="
          Write-Host "              RDP ACCESS"
          Write-Host "========================================="
          Write-Host ""
          Write-Host "Address : $env:TAILSCALE_IP"
          Write-Host "Username: RDP"
          Write-Host "Password: Same RDP_PASSWORD every run"
          Write-Host ""
          Write-Host "========================================="
          Write-Host ""

          while ($true) {

              Write-Host "[$(Get-Date)] RDP Active"

              Start-Sleep -Seconds 300
          }
